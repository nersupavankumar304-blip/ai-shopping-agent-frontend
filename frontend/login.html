<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Shopping Agent</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #172554, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 460px;
            max-width: 92%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
        }

        .header p {
            margin-top: 8px;
            font-size: 18px;
        }

        .login-box {
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin: 0;
            color: #172554;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 8px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 9px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #dc2626;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #15803d;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AI Shopping Agent</h1>
        <p>Find the right product with AI</p>
    </div>

    <div class="login-box">

        <h2>Welcome Back 👋</h2>

        <p class="subtitle">
            Login to continue shopping
        </p>

        <form id="loginForm">

            <label for="name">Your Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <span
                    class="show-password"
                    onclick="togglePassword()"
                >👁️</span>
            </div>

            <button type="submit" id="loginBtn">
                🔐 Login
            </button>

        </form>

        <div id="message"></div>

        <div class="footer">
            🔒 Please use your registered account details.
        </div>

    </div>

</div>

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email")
                .value.trim()
                .toLowerCase();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        const loginBtn =
            document.getElementById("loginBtn");


        message.className = "";
        message.textContent = "";


        if (!name || !email || !password) {

            message.textContent =
                "Please enter all details.";

            message.className = "error";

            return;
        }


        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";


        try {

            /*
             * Your BACKEND login API
             *
             * Change /login only if your
             * backend uses a different route.
             */

            const response = await fetch(
                "https://ai-shopping-agent-backend.onrender.com/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok || !data.success) {

                message.textContent =
                    data.message ||
                    "Incorrect email or password.";

                message.className = "error";

                document.getElementById("password").value = "";

                loginBtn.disabled = false;
                loginBtn.textContent = "🔐 Login";

                return;
            }


            message.textContent =
                "Login successful! Opening AI Shopping Agent...";

            message.className = "success";


            localStorage.setItem(
                "isLoggedIn",
                "true"
            );

            localStorage.setItem(
                "userEmail",
                email
            );

            localStorage.setItem(
                "userName",
                name
            );


            setTimeout(function() {

                window.location.href = "index.html";

            }, 800);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to the login server.";

            message.className = "error";

            loginBtn.disabled = false;
            loginBtn.textContent = "🔐 Login";
        }

    });

</script>

</body>
</html>
