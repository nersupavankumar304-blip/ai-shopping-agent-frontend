<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Shopping Agent - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .box {
            width: 430px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 30px;
            line-height: 1.2;
        }

        .sub {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 16px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            display: block !important;
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            display: block !important;
            background: #e5f8e9;
            color: #16803c;
        }

        .demo {
            margin-top: 20px;
            padding: 14px;
            background: #f3f3ff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
        }

        .demo b {
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🛍️ AI Shopping<br>Agent</h1>

    <p class="sub">Login to continue</p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="demo">
        <b>Demo Account</b>
        <br><br>
        Email: demo@gmail.com
        <br>
        Password: Demo@123
    </div>

</div>


<script>

    // =====================================================
    // DEMO LOGIN CREDENTIALS
    // =====================================================

    const CORRECT_EMAIL = "demo@gmail.com";
    const CORRECT_PASSWORD = "Demo@123";


    // Get elements
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");


    // =====================================================
    // LOGIN
    // =====================================================

    form.addEventListener("submit", function(event) {

        event.preventDefault();


        // Get entered email and password
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;


        // Clear previous message
        message.className = "";
        message.textContent = "";


        // =================================================
        // CHECK BOTH EMAIL AND PASSWORD
        // =================================================

        if (
            email !== CORRECT_EMAIL.toLowerCase() ||
            password !== CORRECT_PASSWORD
        ) {

            message.textContent = "Incorrect email or password.";
            message.className = "error";

            // Clear wrong password
            passwordInput.value = "";

            return;
        }


        // =================================================
        // LOGIN SUCCESS
        // =================================================

        message.textContent =
            "Login successful! Opening AI Shopping Agent...";

        message.className = "success";


        // Disable login button
        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";


        // Save login session
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userEmail", email);


        // Open main website
        setTimeout(function() {

            window.location.href = "index.html";

        }, 800);

    });

</script>

</body>
</html>
