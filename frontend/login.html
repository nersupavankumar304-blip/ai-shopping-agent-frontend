<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Shopping Agent</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .message.error {
            display: block;
            background: #ffe8e8;
            color: #c62828;
            border: 1px solid #ffcaca;
        }

        .message.success {
            display: block;
            background: #e8f8ee;
            color: #16803c;
            border: 1px solid #bce8ca;
        }

        .demo-info {
            margin-top: 25px;
            padding: 12px;
            background: #f5f5ff;
            border-radius: 10px;
            text-align: center;
            color: #555;
            font-size: 12px;
        }

        .demo-info strong {
            color: #444;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">🛍️</div>

            <h1>AI Shopping Agent</h1>

            <p class="subtitle">
                Sign in to find the right products with AI
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    Login
                </button>

            </form>

            <div class="demo-info">
                <strong>Demo Login</strong><br><br>
                Email: demo@gmail.com<br>
                Password: Demo@123
            </div>

            <div class="footer">
                © 2026 AI Shopping Agent
            </div>

        </div>

    </div>

    <script>
        // Demo account credentials
        const VALID_EMAIL = "demo@gmail.com";
        const VALID_PASSWORD = "Demo@123";

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");
        const togglePassword = document.getElementById("togglePassword");


        // Show / hide password
        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }

        });


        // Display message
        function showMessage(text, type) {

            message.textContent = text;
            message.className = "message " + type;

        }


        // Login
        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            // Clear previous message
            message.textContent = "";
            message.className = "message";


            // Check email
            if (email === "") {
                showMessage("Please enter your email address.", "error");
                emailInput.focus();
                return;
            }


            // Check email format
            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                showMessage("Please enter a valid email address.", "error");
                emailInput.focus();
                return;
            }


            // Check password
            if (password === "") {
                showMessage("Please enter your password.", "error");
                passwordInput.focus();
                return;
            }


            // Check credentials
            if (
                email !== VALID_EMAIL ||
                password !== VALID_PASSWORD
            ) {

                showMessage(
                    "Invalid email or password. Please check your credentials.",
                    "error"
                );

                passwordInput.value = "";
                passwordInput.focus();

                return;
            }


            // Successful login
            showMessage(
                "Login successful! Opening AI Shopping Agent...",
                "success"
            );

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            // Store login status
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userEmail", email);


            // Redirect
            setTimeout(function () {
                window.location.href = "index.html";
            }, 800);

        });
    </script>

</body>
</html>
