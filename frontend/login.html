<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping Agent - Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .sub {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #message {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .error {
            display: block !important;
            background: #ffe5e5;
            color: #c62828;
        }

        .success {
            display: block !important;
            background: #e5f8e9;
            color: #16803c;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f3f3ff;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🛍️ AI Shopping Agent</h1>

    <p class="sub">Login to continue</p>

    <form id="loginForm">

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="demo">
        <b>Demo Account</b><br><br>
        Email: demo@gmail.com<br>
        Password: Demo@123
    </div>

</div>

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value
            .trim()
            .toLowerCase();

        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        message.className = "";
        message.textContent = "";

        // CORRECT DEMO CREDENTIALS
        const correctEmail = "demo@gmail.com";
        const correctPassword = "Demo@123";

        if (email !== correctEmail || password !== correctPassword) {

            message.textContent =
                "Invalid email or password.";

            message.className = "error";

            return;
        }

        message.textContent =
            "Login successful! Opening AI Shopping Agent...";

        message.className = "success";

        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userEmail", email);

        setTimeout(function() {
            window.location.href = "index.html";
        }, 800);

    });
</script>

</body>
</html>
